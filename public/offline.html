<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oreo Finance - Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #ffffff;
      color: #0f172a;
      text-align: center;
    }
    img {
      width: 150px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0.8;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #565676; /* Slate Purple */
    }
    p {
      color: #64748b;
      max-width: 300px;
      margin-bottom: 32px;
    }
    button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background-color: #a76571; /* Mauve */
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #8c525d;
    }
  </style>
</head>
<body>
  <img src="/oreo.svg" alt="Oreo the Cat" />
  <h1>You're Offline</h1>
  <p>Please check your internet connection to access your ledger.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
